name: Build Windows (zh-CN fork)

# 只构建 Windows 安装包，不需要任何签名密钥。
# 用法：fork 本仓库 → Actions → 左侧 "Build Windows (zh-CN fork)" → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: bun install

      - name: Build installer (NSIS)
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: blink-eye-zh-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Blink-Eye.exe
          if-no-files-found: error
